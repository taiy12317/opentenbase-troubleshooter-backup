[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otb-troubleshooting-toolkit"
version = "0.1.0"
description = "OpenTenBase deployment preflight, cluster inspection and evidence-based fault diagnosis CLI"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
db = ["psycopg2-binary>=2.9"]
test = ["pytest>=7"]

[project.scripts]
otb-tools = "otb_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
